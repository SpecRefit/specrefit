name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SPECREFIT_BUILD_CHANNEL: ${{ github.ref == 'refs/heads/main' && 'development' || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check types
        run: npm run check
      - name: Run engine tests
        run: npm test
      - name: Test version derivation
        run: npm run test:version
      - name: Test development publication
        run: npm run test:development
      - name: Build viewer
        run: npm run build
      - name: Prepare desktop runtime and Linux libraries
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: |
          node node_modules/electron/install.js
          npx playwright install-deps chromium
      - name: Package and verify desktop
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: |
          npm run package:desktop
          SPECREFIT_TEST_PACKAGE=1 npm run test:desktop
      - name: Archive development downloads
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: npm run archive:development
      - name: Hand off verified development downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-downloads
          path: artifacts/development/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-development:
    name: Publish development downloads
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: development-release-publication
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out publication tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Retrieve this run's verified downloads
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: development-downloads
          path: artifacts/development/
      - name: Publish complete development build as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-development.mjs
